name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Assemble (debug)
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain > build_log.txt 2>&1 || true
          tail -60 build_log.txt
          grep -q "BUILD SUCCESSFUL" build_log.txt

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace --console=plain > unit_log.txt 2>&1 || true
          tail -40 unit_log.txt
          grep -q "BUILD SUCCESSFUL" unit_log.txt

      - name: Upload logs and reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-job-logs
          path: |
            build_log.txt
            unit_log.txt
            app/build/reports/tests/
          retention-days: 7

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Собираем оба APK до старта эмулятора - ошибки компиляции фейлятся быстро
      - name: Assemble debug + androidTest APK
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --console=plain > instr_build_log.txt 2>&1 || true
          tail -60 instr_build_log.txt
          grep -q "BUILD SUCCESSFUL" instr_build_log.txt

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.build.version.sdk
            df -h /data | tail -1
            adb install -r app/build/outputs/apk/debug/app-debug.apk > install_out.txt 2>&1 || true
            cat install_out.txt
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain || { adb logcat -d > logcat_fail.txt 2>&1; tail -100 logcat_fail.txt; exit 1; }

      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-logs
          path: |
            instr_build_log.txt
            install_out.txt
            logcat_fail.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-logs
          path: |
            instr_build_log.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
