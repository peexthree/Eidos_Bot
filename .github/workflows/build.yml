name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Accept Licenses & Install Android SDK 35
      run: |
        echo "Fixing runner permissions..."
        sudo chown -R runner:docker /home/runner
        mkdir -p /home/runner/.config/.android /home/runner/.android
        sudo chown -R runner:docker /home/runner/.config /home/runner/.android
        echo "Accepting licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        echo "Installing Android SDK 35 and Build Tools..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0"
        sudo chown -R runner:docker $ANDROID_HOME

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      shell: bash
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_gradle.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          echo "========================================="
          echo "💥 GRADLE BUILD FAILED (Exit Code: $EXIT_CODE)"
          echo "========================================="
          echo ">>> COMPILATION ERRORS:"
          grep -E "(^e: |error: |FAILURE:|What went wrong)" build_gradle.log || true
          echo ">>> LAST 100 LINES:"
          tail -n 100 build_gradle.log
          exit $EXIT_CODE
        fi

    - name: Locate APK Files
      run: |
        echo "=== Locating any generated APK files ==="
        find app/build/outputs/ -type f || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "app/build/outputs/apk/**/*.apk"

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_gradle.log
